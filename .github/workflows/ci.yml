name: CI — Tests, Quality Gates & Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  FRONTEND_DIR: './frontend'

jobs:
  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.FRONTEND_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '${{ env.FRONTEND_DIR }}/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ${{ env.FRONTEND_DIR }}/coverage/
          retention-days: 7

      - name: npm audit
        if: always()
        run: npm audit --audit-level=high || true

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '${{ env.FRONTEND_DIR }}/package-lock.json'

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ${{ env.FRONTEND_DIR }}

      - name: npm audit
        run: npm audit --audit-level=high
        working-directory: ${{ env.FRONTEND_DIR }}
        continue-on-error: true

      - name: Check for secrets in codebase
        run: |
          echo "Checking for potential secrets in source files..."
          if grep -rn "change-me-in-production\|supersecretkey\|PASSWORD=" --include="*.py" --include="*.ts" --include="*.tsx" --include="*.js" --include="*.json" --exclude-dir=node_modules --exclude-dir=.git --exclude="package-lock.json" .; then
            echo "WARNING: Found potential hardcoded secrets!"
            exit 1
          else
            echo "No obvious secrets found."
          fi
        continue-on-error: true

      - name: Check for outdated dependencies
        run: |
          echo "Checking for npm outdated packages..."
          npm outdated --long || true
        working-directory: ${{ env.FRONTEND_DIR }}

  build:
    name: Vite Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.FRONTEND_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '${{ env.FRONTEND_DIR }}/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
