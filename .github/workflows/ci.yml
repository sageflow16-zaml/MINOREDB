name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: minore
          POSTGRES_PASSWORD: minore
          POSTGRES_DB: minore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready -U minore
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r backend/requirements.txt
      - run: pip install pytest pytest-asyncio httpx

      - name: Run backend tests
        run: python -m pytest backend/tests/ -v --tb=short
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://minore:minore@localhost:5432/minore_test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: extension/package-lock.json

      - run: npm ci
        working-directory: extension
      - run: npm run build
        working-directory: extension
