name: CI — Tests, Quality Gates & Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.12'
  FRONTEND_DIR: './frontend'
  BACKEND_DIR: './backend'

jobs:
  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.FRONTEND_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '${{ env.FRONTEND_DIR }}/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ${{ env.FRONTEND_DIR }}/coverage/
          retention-days: 7

      - name: npm audit
        if: always()
        run: npm audit --audit-level=high || true

  backend:
    name: Backend Tests & Security
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: minore
          POSTGRES_DB: minore_test
          POSTGRES_PASSWORD: minore
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: '${{ env.BACKEND_DIR }}/requirements.txt'

      - name: Install backend dependencies
        run: pip install -r ${{ env.BACKEND_DIR }}/requirements.txt
        working-directory: ${{ env.BACKEND_DIR }}

      - name: Run backend tests
        run: python -m pytest ${{ env.BACKEND_DIR }}/tests/ -v --tb=short
        env:
          TEST_DATABASE_URL: postgresql+psycopg://minore:minore@localhost:5432/minore_test
          JWT_SECRET_KEY: ci-secret-key-that-is-at-least-32-characters-long
          RATE_LIMIT_PER_MINUTE: 0

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '${{ env.FRONTEND_DIR }}/package-lock.json'

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ${{ env.FRONTEND_DIR }}

      - name: npm audit
        run: npm audit --audit-level=high
        working-directory: ${{ env.FRONTEND_DIR }}
        continue-on-error: true

      - name: Check for secrets in codebase
        run: |
          echo "Checking for potential secrets in source files..."
          if grep -rn "change-me-in-production\|supersecretkey\|PASSWORD=" --include="*.py" --include="*.ts" --include="*.tsx" --include="*.js" --include="*.json" --exclude-dir=node_modules --exclude-dir=.git --exclude="package-lock.json" .; then
            echo "WARNING: Found potential hardcoded secrets!"
            exit 1
          else
            echo "No obvious secrets found."
          fi
        continue-on-error: true

      - name: Check for outdated dependencies
        run: |
          echo "Checking for npm outdated packages..."
          npm outdated --long || true
        working-directory: ${{ env.FRONTEND_DIR }}

  build:
    name: Vite Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.FRONTEND_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '${{ env.FRONTEND_DIR }}/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
