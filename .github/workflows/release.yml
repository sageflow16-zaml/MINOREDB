name: Release — Tag & Publish

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  check-version:
    name: Version Consistency Check
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
      - name: Verify VERSION file matches tag
        run: |
          FILE_VER=$(cat VERSION | tr -d '\n')
          TAG_VER="${GITHUB_REF#refs/tags/v}"
          if [ "$FILE_VER" != "$TAG_VER" ]; then
            echo "Mismatch: VERSION=$FILE_VER tag=$TAG_VER"
            exit 1
          fi
          echo "Version $TAG_VER verified"

  create-release:
    name: Create GitHub Release
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate changelog excerpt
        id: changelog
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          awk -v ver="$VERSION" '
            /^## \['"$VERSION"'\]/ {flag=1; next}
            /^## \[/ {flag=0}
            flag && NF {print}
          ' CHANGELOG.md > release_notes.md
          echo "Changelog excerpt written to release_notes.md"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          generate_release_notes: false
          files: |
            VERSION
            CHANGELOG.md
