# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: project-minore-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT --workers 1
    workingDirectory: backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: 10000
      - key: DOCS_ENABLED
        value: "false"
      - key: HSTS_ENABLED
        value: "true"
      - key: RATE_LIMIT_PER_MINUTE
        value: "120"
      - key: DATABASE_URL
        fromDatabase:
          name: project-minore-db
          property: connectionString
      - key: JWT_SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://project-minore.vercel.app
      - key: ALLOWED_HOSTS
        value: .onrender.com,.vercel.app,localhost

databases:
  - name: project-minore-db
    region: oregon
    plan: free
    databaseName: minore
    user: minore
