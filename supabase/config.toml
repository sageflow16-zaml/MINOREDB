project_id = "wlpukdzvcidbwwwehiql"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 54322
shadow_port = 54320
major_version = 15
health_timeout = "2m"

[db.pooler]
enabled = false

[db.migrations]
enabled = true

[db.seed]
enabled = true

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.buckets.sources]
public = false
allowed_mime_types = ["text/plain", "application/pdf", "application/vnd.openxmlformats-officedocument.wordprocessingml.document"]
file_size_limit = "50MB"

[storage.buckets.trade-images]
public = false
allowed_mime_types = ["image/png", "image/jpeg", "image/webp"]
file_size_limit = "10MB"

[storage.buckets.avatars]
public = true
allowed_mime_types = ["image/png", "image/jpeg", "image/webp", "image/gif"]
file_size_limit = "2MB"

[storage.buckets.replay-screenshots]
public = false
allowed_mime_types = ["image/png", "image/jpeg", "image/webp"]
file_size_limit = "10MB"

[storage.buckets.knowledge-images]
public = false
allowed_mime_types = ["image/png", "image/jpeg", "image/webp", "image/svg+xml"]
file_size_limit = "5MB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
jwt_expiry = 3600
enable_signup = true
minimum_password_length = 6

[auth.email]
enable_signup = true
enable_confirmations = false

[auth.sessions]
timebox = "24h"

[auth.rate_limit]
email_sent = 2
sms_sent = 30
token_refresh = 150
sign_in_sign_ups = 30

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = false
verify_enabled = false

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083
deno_version = 2

[analytics]
enabled = true
port = 54327
backend = "postgres"

[experimental]
orioledb_version = ""

# Edge function JWT verification policy.
# ai/collector require an authenticated user session (frontend always sends the
# user JWT via supabase.functions.invoke). tv-webhook must stay open because
# TradingView posts webhooks without authentication; the function itself
# validates the project_id from the caller JWT or webhook payload.
[functions.ai]
verify_jwt = true

[functions.collector]
verify_jwt = true

[functions.tv-webhook]
verify_jwt = false
