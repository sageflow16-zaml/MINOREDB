[project]
# ---------------------------------------------------------------
# MINORE — Supabase Configuration
# After linking, `supabase link --project-ref <ref>` fills project_id.
# ---------------------------------------------------------------
# plan = "pro"                              # uncomment for paid tier
# experimental.orientdb_version = "latest"  # not used

[auth]
enabled = true
# ----- providers -----
[auth.external]
enabled = false
[auth.email]
enabled = true
enable_confirmations = false               # email confirm off for dev;
                                            # set true in production

# ----- session / security -----
auth.session.access_token_exp = 3600        # 1 hour
auth.session.refresh_token_exp = 2592000    # 30 days
auth.sessions_timebox = false

# ----- rate limiting -----
[auth.rate_limit]
# defaults are fine

# =====================================================================
# API GATEWAY
# =====================================================================
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public"]
# max_request_size = 10_000_000   # 10 MB (default)

# =====================================================================
# DATABASE
# =====================================================================
[db]
# postgres-meta will apply migrations; this file is for Supabase Studio
# and CLI awareness.

# ----- extensions to enable -----
[db.extensions]
pgvector = { schema = "extensions", version = "0.7.0" }
pgcrypto = { schema = "extensions", version = "1.3" }
pg_stat_statements = { schema = "extensions", version = "1.10" }

# =====================================================================
# STORAGE
# =====================================================================
[storage]
enabled = true

[storage.buckets]
# Trade screenshots
[storage.buckets.trade-images]
public = false
allowed_mime_types = ["image/png", "image/jpeg", "image/webp"]
file_size_limit = "10MB"

# User avatars
[storage.buckets.avatars]
public = true
allowed_mime_types = ["image/png", "image/jpeg", "image/webp", "image/gif"]
file_size_limit = "2MB"

# Replay session screenshots
[storage.buckets.replay-screenshots]
public = false
allowed_mime_types = ["image/png", "image/jpeg", "image/webp"]
file_size_limit = "10MB"

# Knowledge / concept images
[storage.buckets.knowledge-images]
public = false
allowed_mime_types = ["image/png", "image/jpeg", "image/webp", "image/svg+xml"]
file_size_limit = "5MB"

# =====================================================================
# EDGE FUNCTIONS
# =====================================================================
[functions]
enabled = true
# verify_jwt = true                       # enforce JWT on all functions
# Deno import map — if needed for shared deps
# import_map = "./functions/_shared/import_map.json"

# ----- Individual function config -----
[functions.ai]
verify_jwt = false                        # uses its own auth header
# env vars set via dashboard or `supabase secrets set`

[functions.collector]
verify_jwt = true

[functions.broker-sync]
verify_jwt = true

[functions.automation-connector]
verify_jwt = true

[functions.obsidian-sync]
verify_jwt = true

[functions.replay-data]
verify_jwt = true

[functions.mt5]
verify_jwt = true

[functions.tv-webhook]
verify_jwt = false                        # signed by TradingView secret, not user JWT
