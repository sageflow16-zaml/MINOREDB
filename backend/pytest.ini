[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -v --tb=short --cov=src --cov-report=term --cov-report=html --cov-report=xml --no-header
cov_include = src/
cov_exclude = */tests/*,*/migrations/*,*/alembic/*,*__init__.py
cov_fail_under = 70
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests requiring DB
    unit: marks tests as pure unit tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning