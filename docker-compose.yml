# Docker Compose is no longer needed for production.
# Minore is now 100% Supabase-native.
# - Frontend: Vercel (static SPA)
# - Database: Supabase PostgreSQL
# - Auth: Supabase Auth
# - AI/API: Supabase Edge Functions
# - Storage: Supabase Storage
# - Realtime: Supabase Realtime
#
# This file is kept only for local Supabase development.
# Use `supabase start` for local development instead.
version: "3.9"
services:
  # Local development only — Supabase replaces this entire stack
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: minore
      POSTGRES_DB: minore
      POSTGRES_PASSWORD: minore
    ports:
      - "5432:5432"
volumes:
  postgres_data:
